<style>
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        color: white;
    }

    body {
        background: url('images/FRISSON_HeroImage_Tagline_2400px.jpeg') no-repeat center center/cover;
        display: flex;
        justify-content: center;
        align-items: flex-end;
    }

    /* Floating form styling */
    #consult-form {
        margin-bottom: 8%;
        display: flex;
        backdrop-filter: blur(10px);
        background: rgba(0, 0, 0, 0.4);
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        animation: fadeInUp 1.2s ease-out;
    }

    #consult-form input[type="text"] {
        padding: 0.85em;
        font-size: 1em;
        border: none;
        outline: none;
        width: 300px;
        background: rgba(50, 50, 50, 0.85);
        color: #aaa;
    }

    #consult-form input[type="submit"] {
        padding: 0.85em 1.5em;
        font-size: 1em;
        font-family: 'Modern Symphony', serif;
        border: none;
        background: #2f2f2f; /* Luxe charcoal */
        color: #aaa;
        cursor: pointer;
        font-weight: bold;
        letter-spacing: 0.05em;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.4s, transform 0.3s;
    }

    #consult-form input[type="submit"]:hover {
        background: #1a1a1a;
        transform: scale(1.05);
    }

    /* Cinematic thank-you */
    #thank-you {
        position: fixed;
        bottom: 50%;
        left: 50%;
        transform: translate(-50%, 50%) scale(0.9);
        background: rgba(0, 0, 0, 0.75);
        padding: 1em 2em;
        border-radius: 8px;
        font-size: 1.8em;
        color: #ccc;
        opacity: 0;
        pointer-events: none;
        text-shadow: 0 0 10px rgba(255,255,255,0.2);
        transition: opacity 2s ease, transform 2s ease;
    }

    #thank-you.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }

    /* Fade-in animation for the form */
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
