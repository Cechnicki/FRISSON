<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Modern+Symphony&display=swap" rel="stylesheet">
<style>
    html, body {
        margin: 0;
        padding: 0;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        color: white;
        height: 100%;
    }

    body {
        background: url('images/FRISSON_HeroImage_Tagline_2400px.jpeg') no-repeat center center;
        background-size: cover;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        min-height: 100vh;
    }

    /* Floating form styling */
    #consult-form {
        margin-bottom: 8%;
        display: flex;
        backdrop-filter: blur(10px);
        background: rgba(0, 0, 0, 0.4);
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        animation: fadeInUp 1.2s ease-out;
    }

    #consult-form input[type="text"] {
        padding: 0.85em;
        font-size: 1em;
        border: none;
        outline: none;
        width: 300px;
        background: rgba(50, 50, 50, 0.85);
        color: #aaa;
    }

    #consult-form input[type="submit"] {
        padding: 0.85em 1.5em;
        font-size: 1em;
        font-family: 'Modern Symphony', serif;
        border: none;
        background: #2f2f2f; /* Luxe charcoal */
        color: #aaa;
        cursor: pointer;
        font-weight: bold;
        letter-spacing: 0.05em;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.4s, transform 0.3s;
    }

    #consult-form input[type="submit"]:hover {
        background: #1a1a1a;
        transform: scale(1.05);
    }

    /* Cinematic thank-you */
    #thank-you {
        position: fixed;
        bottom: 50%;
        left: 50%;
        transform: translate(-50%, 50%) scale(0.9);
        background: rgba(0, 0, 0, 0.75);
        padding: 1em 2em;
        border-radius: 8px;
        font-size: 1.8em;
        color: #ccc;
        opacity: 0;
        pointer-events: none;
        text-shadow: 0 0 10px rgba(255,255,255,0.2);
        transition: opacity 2s ease, transform 2s ease;
    }

    #thank-you.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }

    /* Fade-in animation for the form */
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
<body>

<form id="consult-form" action="https://formspree.io/f/mzzvyeyl" method="POST">
    <input type="hidden" name="_subject" value="Form Request for Consultation">
    <input type="text" name="contact" placeholder="Enter Email or Text" required>
    <input type="submit" value="REQUEST CONSULTATION">
</form>

<div id="thank-you">Mahalo nui loa!</div>

<script>
    // Fix mobile vh bug
    function setBodyHeight() {
        document.body.style.minHeight = window.innerHeight + 'px';
    }
    window.addEventListener('resize', setBodyHeight);
    window.addEventListener('orientationchange', setBodyHeight);
    setBodyHeight();

    document.getElementById('consult-form').addEventListener('submit', function(event) {
        event.preventDefault();
        var form = this;
        fetch(form.action, {
            method: form.method,
            body: new FormData(form),
            headers: { 'Accept': 'application/json' }
        }).then(response => {
            if (response.ok) {
                let thankYou = document.getElementById('thank-you');
                thankYou.classList.add('show');
                form.reset();
                setTimeout(() => {
                    thankYou.classList.remove('show');
                }, 4000);
            } else {
                alert('Something went wrong. Please try again.');
            }
        }).catch(() => {
            alert('Something went wrong. Please try again.');
        });
    });
</script>

</body>
</html>
